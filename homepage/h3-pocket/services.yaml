# H3 Pocket — what matters first, everything else one tap away.

- Fleet:
    - Overall:
        icon: mdi-heart-pulse
        href: http://192.168.1.141:3009/latest.json
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_HUB_IP}}:3009/latest.json
          refreshInterval: 60000
          mappings:
            - field: overall
              label: Fleet
            - field: warnCount
              label: Warn
              format: number
            - field: critCount
              label: Crit
              format: number
            - field: generatedAt
              label: Sweep
              format: relativeDate
              style: short
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://192.168.1.141:3001
        widget:
          type: uptimekuma
          url: http://{{HOMEPAGE_VAR_HUB_IP}}:3001
          slug: homelab

- Alerts:
    - Open alerts:
        icon: mdi-alert-circle
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_HUB_IP}}:3009/latest.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: alerts
            name: host
            label: msg
            limit: 10

