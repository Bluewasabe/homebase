- Hub:
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://192.168.1.141:3001
        description: status page /status/homelab
        server: hub
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://{{HOMEPAGE_VAR_HUB_IP}}:3001
          slug: homelab
    - Fleet:
        icon: mdi-heart-pulse
        href: http://192.168.1.141:3009/latest.json
        description: healthwatch snapshot, every 5 min
        server: hub
        container: feed
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_HUB_IP}}:3009/latest.json
          refreshInterval: 60000
          mappings:
            - field: overall
              label: Overall
            - field: warnCount
              label: Warn
              format: number
            - field: critCount
              label: Crit
              format: number
            - field: generatedAt
              label: Sweep
              format: relativeDate
              style: short
    - Alerts:
        icon: mdi-alert-circle
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_HUB_IP}}:3009/latest.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: alerts
            name: host
            label: msg
            limit: 8
    - Bake-off:
        icon: mdi-scale-balance
        description: H2 :3102 · H3 :3103 · G1 :3201 · G2 :3202 · G3 :3203
        href: http://192.168.1.141:3102

