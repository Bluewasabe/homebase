# Single source of truth for every service the home base links or monitors.
# Generated from healthwatch state + `docker ps -a` on every host, 2026-09-15.
#
# Fields
#   name    container / service id            label   display name
#   host    key into hosts.yaml               kind    http | tcp | game-mc | game-udp | infra | link
#   url     link target (omit = not linked)   port    published port
#   status  live | paused | retired           fn      media | games | ai | infra | business | dev | family
#   icon    dashboard-icons name or mdi-*     kuma    http | port | ping | gamedig:<game> | none
#   check   URL Kuma probes when it differs from url
#   link    false = never shown as a link (sidecars, localhost-only binds)
#   note    free text shown in comparison / tooltips

