<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Deck · Homebase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
<style>
  :root {
    --ground: #0A0C0E; --panel: #15191D; --bezel: #262C33; --line: #313841;
    --ink: #D9E1E8; --dim: #7E8994; --green: #62E39C; --amber: #F2B233; --red: #FF4A3D; --cyan: #6FD3FF;
    --tile-off: #1B2026; --tile-text-off: #3B444D;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--ground); color: var(--ink); margin: 0; }
  body { font: 14px/1.4 "B612", system-ui, sans-serif; padding-inline: 18px; padding-block: 14px 28px; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: "B612 Mono", ui-monospace, monospace; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; border-bottom: 2px solid var(--line); padding-bottom: 8px; margin-bottom: 14px; }
  header h1 { font: 700 20px "B612 Mono", monospace; letter-spacing: .12em; margin: 0; color: var(--cyan); }
  header .k { color: var(--dim); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  header .v { font-family: "B612 Mono", monospace; }
  header .spacer { flex: 1; }

  /* annunciator panel */
  .annun { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; background: var(--bezel); padding: 8px; border-radius: 4px; }
  .tile { background: var(--tile-off); color: var(--tile-text-off); border-radius: 2px; padding: 8px 8px; font: 700 12px/1.2 "B612 Mono", monospace; letter-spacing: .08em; text-transform: uppercase; text-align: center; min-height: 46px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px #0d1013, inset 0 2px 6px rgba(0,0,0,.6); }
  .tile small { display: block; font: 400 10px "B612 Mono", monospace; letter-spacing: .04em; opacity: .85; text-transform: none; }
  .tile.amber { background: #3d2c07; color: var(--amber); box-shadow: inset 0 0 0 1px #6b4d0c, 0 0 14px rgba(242,178,51,.35); }
  .tile.red { background: #4a1210; color: var(--red); box-shadow: inset 0 0 0 1px #8a2320, 0 0 14px rgba(255,74,61,.4); animation: blink 1.1s steps(2, start) infinite; }
  .tile.green { background: #0f3323; color: var(--green); box-shadow: inset 0 0 0 1px #1d6b47, 0 0 10px rgba(98,227,156,.25); }
  .tile.cyan { background: #0b2c3a; color: var(--cyan); box-shadow: inset 0 0 0 1px #17607d; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .tile.red { animation: none; } }

  /* instruments */
  .row { display: grid; gap: 14px; margin-top: 14px; }
  .engines { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .cluster { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; }
  .cluster h2 { margin: 0 0 6px; font: 700 12px "B612 Mono", monospace; letter-spacing: .12em; color: var(--dim); display: flex; justify-content: space-between; }
  .cluster h2 b { color: var(--ink); }
  .cluster h2 .st { font-weight: 400; }
  .gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .gauge { text-align: center; }
  .gauge canvas { width: 100%; height: auto; display: block; }
  .gauge .lbl { font: 11px "B612 Mono", monospace; letter-spacing: .1em; color: var(--dim); margin-top: -4px; }
  .readouts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font: 12px "B612 Mono", monospace; color: var(--dim); }
  .readouts b { color: var(--ink); font-weight: 400; }
  .readouts .warn { color: var(--amber); } .readouts .crit { color: var(--red); }
  .nodata { color: var(--dim); font: 12px "B612 Mono", monospace; letter-spacing: .1em; text-align: center; padding: 30px 0; border: 1px dashed var(--line); border-radius: 4px; }

  .lower { grid-template-columns: minmax(300px, 1.1fr) minmax(280px, .9fr) minmax(280px, 1fr); }
  @media (max-width: 1100px) { .lower { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 720px) { .lower { grid-template-columns: 1fr; } .gauges { grid-template-columns: repeat(3, 1fr); } }
  .scope { position: relative; }
  .scope canvas { width: 100%; height: auto; display: block; border-radius: 50%; }
  .scope .hint { position: absolute; left: 12px; bottom: 12px; font: 11px "B612 Mono", monospace; color: var(--dim); pointer-events: none; }
  .scope .tip { position: absolute; pointer-events: none; background: #000c; border: 1px solid var(--line); padding: 4px 8px; font: 12px "B612 Mono", monospace; color: var(--ink); border-radius: 3px; display: none; white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 11px "B612 Mono", monospace; color: var(--dim); margin-top: 6px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  .list { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .list li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 3px; font: 13px "B612", sans-serif; }
  .list li:hover { background: #ffffff0a; }
  .list .led { width: 8px; height: 8px; border-radius: 50%; background: var(--tile-text-off); box-shadow: 0 0 0 1px #000 inset; }
  .list .led.up { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .list .led.down { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .list .led.pending { background: var(--amber); } .list .led.paused { background: #3b444d; }
  .list .r { font: 12px "B612 Mono", monospace; color: var(--dim); text-align: right; }
  .list .r b { color: var(--ink); font-weight: 400; }
  .grp { font: 700 11px "B612 Mono", monospace; letter-spacing: .12em; color: var(--dim); margin: 10px 0 4px; }
  .grp:first-child { margin-top: 0; }
  .sub { font: 12px "B612 Mono", monospace; color: var(--dim); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>FLIGHT DECK</h1>
  <span><span class="k">Local</span> <span class="v" id="clock">--:--</span></span>
  <span><span class="k">Zulu</span> <span class="v" id="zulu">--:--</span></span>
  <span><span class="k">Sweep</span> <span class="v" id="sweep">—</span></span>
  <span><span class="k">Monitors</span> <span class="v" id="mon">—</span></span>
  <span class="spacer"></span>
  <span class="sub">hub 192.168.1.141 · refresh 60 s · <a href="/kuma/status/homelab" class="v">status page</a></span>
</header>

<section class="annun" id="annun" aria-label="Annunciator panel"></section>

<section class="row engines" id="engines"></section>

<section class="row lower">
  <div class="cluster">
    <h2>NAV · SERVICE SCOPE <span class="st sub">click a blip to open</span></h2>
    <div class="scope"><canvas id="scope" width="520" height="520"></canvas><div class="hint">sector = host · ring = function</div><div class="tip" id="tip"></div></div>
    <div class="legend"><span><i style="background:var(--green)"></i>up</span><span><i style="background:var(--red)"></i>down</span><span><i style="background:var(--amber)"></i>pending</span><span><i style="background:#3b444d"></i>paused</span><span><i style="background:var(--cyan)"></i>link only</span></div>
  </div>
  <div class="cluster">
    <h2>FLIGHT PLAN <span class="st sub">games · plex</span></h2>
    <div id="plan"></div>
  </div>
  <div class="cluster">
    <h2>CHECKLIST <span class="st sub">every tool</span></h2>
    <div id="checklist"></div>
  </div>
</section>

<script src="/shared/services.js"></script>
<script src="/shared/data.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const COL = { up: '#62E39C', down: '#FF4A3D', pending: '#F2B233', paused: '#3b444d', retired: '#2a3036', none: '#6FD3FF', maint: '#6FD3FF' };
const FN_ORDER = ['infra', 'media', 'games', 'ai', 'business', 'dev', 'family'];
const RING_ORDER = ['family', 'dev', 'business', 'ai', 'media', 'infra', 'games']; // busiest functions on the outer, longer rings
const SECTORS = [['Server-Rig', ['Server-Rig']], ['PlexBoy', ['PlexBoy']], ['pve & net', ['pve', 'nginx-vm', 'fibi', 'plausible', 'udm', 'scrypted', 'rustdesk']], ['hub', ['hub']], ['cloud', ['cloud', 'BlueRig']]];

function tick() {
  const n = new Date();
  $('#clock').textContent = n.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('#zulu').textContent = n.toISOString().slice(11, 16) + 'Z';
}
setInterval(tick, 1000); tick();

// ---------- gauges
function drawGauge(cv, value, opts) {
  const { label, unit = '%', red = [90, 100], amber = [75, 90], invert = false, max = 100 } = opts;
  const ctx = cv.getContext('2d'); const W = cv.width, H = cv.height; const cx = W / 2, cy = H / 2 + 6, r = W * .40;
  ctx.clearRect(0, 0, W, H);
  const a0 = Math.PI * .75, a1 = Math.PI * 2.25;
  const ang = v => a0 + (a1 - a0) * Math.min(max, Math.max(0, v)) / max;
  ctx.lineWidth = 3; ctx.strokeStyle = '#313841'; ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
  // zones
  const zone = (from, to, col) => { ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, r, ang(from), ang(to)); ctx.stroke(); };
  zone(amber[0], amber[1], '#7a5a19'); zone(red[0], red[1], '#8a2320');
  // ticks
  ctx.strokeStyle = '#7E8994'; ctx.lineWidth = 1.5;
  for (let i = 0; i <= 10; i++) { const a = ang(i * max / 10); const l = i % 5 === 0 ? 12 : 6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (r - 10), cy + Math.sin(a) * (r - 10)); ctx.lineTo(cx + Math.cos(a) * (r - 10 - l), cy + Math.sin(a) * (r - 10 - l)); ctx.stroke(); }
  const has = value != null && !isNaN(value);
  const v = has ? value : 0;
  const state = !has ? 'none' : (v >= red[0] && v <= red[1]) ? 'red' : (v >= amber[0] && v <= amber[1]) ? 'amber' : 'ok';
  // needle
  if (has) { const a = ang(v); ctx.strokeStyle = state === 'red' ? '#FF4A3D' : state === 'amber' ? '#F2B233' : '#D9E1E8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - Math.cos(a) * 10, cy - Math.sin(a) * 10); ctx.lineTo(cx + Math.cos(a) * (r - 16), cy + Math.sin(a) * (r - 16)); ctx.stroke(); }
  ctx.fillStyle = '#262C33'; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
  // digital
  ctx.font = `700 ${Math.round(W * .17)}px "B612 Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = state === 'red' ? '#FF4A3D' : state === 'amber' ? '#F2B233' : state === 'none' ? '#7E8994' : '#6FD3FF';
  ctx.fillText(has ? `${Math.round(v)}${unit}` : '----', cx, cy + r * .55);
  ctx.font = `${Math.round(W * .085)}px "B612 Mono", monospace`; ctx.fillStyle = '#7E8994';
  ctx.fillText(label, cx, cy + r * .82);
}

function gaugeEl(id) { return `<div class="gauge"><canvas id="${id}" width="180" height="150"></canvas></div>`; }

function renderEngines(d) {
  const feedHosts = ['Server-Rig', 'PlexBoy', 'BlueRig'];
  let html = '';
  for (const name of feedHosts) {
    const h = HB.host(name); const ip = HB.hostIp[name];
    const worst = h ? HB.worstDisk(h) : null;
    const cont = h?.docker?.containers || [];
    const running = cont.filter(c => c.state === 'running').length;
    const runningC = cont.filter(c => c.state === 'running');
    const unhealthy = runningC.filter(c => c.health === 'unhealthy').map(c => c.name);
    const restarts = runningC.reduce((a, c) => a + (c.restarts || 0), 0);
    const exited = cont.length - runningC.length;
    const st = !h ? 'NO DATA' : h.reachable ? 'ONLINE' : 'OFFLINE';
    html += `<div class="cluster"><h2><b>${name}</b><span class="st" style="color:${h?.reachable ? 'var(--green)' : 'var(--red)'}">${st} · ${ip}</span></h2>
      ${h ? `<div class="gauges">${gaugeEl('g-' + name + '-cpu')}${gaugeEl('g-' + name + '-mem')}${gaugeEl('g-' + name + '-disk')}</div>
      <div class="readouts"><span>CTR <b>${running}/${cont.length}</b></span>
        <span class="${unhealthy.length ? 'warn' : ''}">UNHLTHY <b>${unhealthy.length}</b>${unhealthy.length ? ' ' + esc(unhealthy.join(', ')) : ''}</span>
        <span>RESTARTS <b>${restarts}</b></span>
        <span class="${exited ? 'warn' : ''}">EXITED <b>${exited}</b></span>
        <span>UP <b>${h.uptimeHours != null ? h.uptimeHours.toFixed(0) + 'h' : '—'}</b></span>
        <span>MEM <b>${h.memFreeGB != null ? h.memFreeGB.toFixed(0) + ' GB free' : '—'}</b></span>
        ${worst ? `<span class="${worst.freePct < 10 ? 'crit' : worst.freePct < 20 ? 'warn' : ''}">WORST DISK <b>${esc(worst.drive)} ${worst.freePct}% free</b></span>` : ''}
      </div>` : `<div class="nodata">NO DATA · NOT IN LAST SWEEP</div>`}
    </div>`;
  }
  // pve from its API
  const p = d.pve;
  html += `<div class="cluster"><h2><b>pve</b><span class="st" style="color:${p ? 'var(--green)' : 'var(--red)'}">${p ? 'ONLINE' : 'NO DATA'} · 192.168.1.6</span></h2>
    ${p ? `<div class="gauges">${gaugeEl('g-pve-cpu')}${gaugeEl('g-pve-mem')}${gaugeEl('g-pve-root')}</div>
    <div class="readouts"><span>GUESTS <b>${p.guests.filter(g => g.status === 'running').length}/${p.guests.length}</b></span><span>UP <b>${p.uptimeDays}d</b></span><span>MEM <b>${p.memUsedGB}/${p.memTotalGB} GB</b></span>
    ${p.guests.map(g => `<span style="${g.status === 'running' ? '' : 'opacity:.45'}">${esc(g.name)} <b>${g.status === 'running' ? '●' : '○'}</b></span>`).join('')}</div>` : `<div class="nodata">NO DATA · PROXMOX API</div>`}
  </div>`;
  $('#engines').innerHTML = html;
  for (const name of feedHosts) {
    const h = HB.host(name); if (!h) continue;
    const worst = HB.worstDisk(h);
    drawGauge($('#g-' + name + '-cpu'), h.cpuPct, { label: 'CPU', red: [90, 100], amber: [70, 90] });
    drawGauge($('#g-' + name + '-mem'), h.memUsedPct, { label: 'MEM', red: [90, 100], amber: [80, 90] });
    drawGauge($('#g-' + name + '-disk'), worst ? worst.freePct : null, { label: `${worst ? worst.drive : ''} FREE`, red: [0, 10], amber: [10, 20] });
  }
  if (p) {
    drawGauge($('#g-pve-cpu'), p.cpu, { label: 'CPU', red: [90, 100], amber: [70, 90] });
    drawGauge($('#g-pve-mem'), p.memPct, { label: 'MEM', red: [90, 100], amber: [80, 90] });
    drawGauge($('#g-pve-root'), p.rootPct, { label: 'ROOT USED', red: [90, 100], amber: [75, 90] });
  }
}

// ---------- annunciator
function renderAnnun(d) {
  const f = d.feed; const alerts = f?.alerts || [];
  const hostsDown = (f?.hosts || []).filter(h => !h.reachable).map(h => h.name);
  const disk = alerts.filter(a => a.key.startsWith('disk:'));
  const unhealthy = alerts.filter(a => a.key.startsWith('unhealthy:'));
  const ports = alerts.filter(a => a.key.startsWith('port:') || a.key.startsWith('http:'));
  const gamesOff = d.mc.filter(g => !g.online).map(g => g.label);
  const monDown = Object.values(d.kuma.byName).filter(m => m.status === 'down').map(m => m.name);
  const stale = f ? (Date.now() - new Date(f.generatedAt)) > 12 * 60e3 : true;
  const crit = (f?.critCount || 0) > 0 || hostsDown.length > 0;
  const warn = (f?.warnCount || 0) > 0 || monDown.length > 0 || gamesOff.length > 0;
  const tiles = [
    ['MASTER WARNING', crit ? 'red' : '', crit ? `${hostsDown.length ? hostsDown.join(', ') : (f?.critCount + ' crit')}` : ''],
    ['MASTER CAUTION', !crit && warn ? 'amber' : (crit ? 'amber' : ''), warn ? `${f?.warnCount || 0} warn · ${monDown.length} mon` : ''],
    ['HOST DOWN', hostsDown.length ? 'red' : '', hostsDown.join(', ')],
    ['DISK LOW', disk.length ? 'amber' : '', disk.map(a => a.msg.replace(/free.*/, 'free')).join(' · ')],
    ['CTR UNHEALTHY', unhealthy.length ? 'amber' : '', unhealthy.map(a => a.msg.replace('container ', '').replace(' reports unhealthy', '')).join(', ')],
    ['PORT CLOSED', ports.length ? 'amber' : '', ports.map(a => a.msg.split(' ')[1]).join(', ')],
    ['GAME OFFLINE', gamesOff.length ? 'red' : '', gamesOff.join(', ')],
    ['MONITOR DOWN', monDown.length ? 'amber' : '', monDown.map(n => n.split(' · ')[1]).join(', ')],
    ['FEED STALE', stale ? 'amber' : '', stale && f ? HB.fmtAgo(f.generatedAt) : ''],
    ['PLEX ACTIVE', d.plex?.streams ? 'green' : '', d.plex?.streams ? `${d.plex.streams} stream${d.plex.streams > 1 ? 's' : ''}` : ''],
    ['PLAYERS ON', d.mc.some(g => g.players > 0) ? 'green' : '', d.mc.filter(g => g.players > 0).map(g => `${g.label} ${g.players}`).join(', ')],
    ['ALL SYSTEMS', !crit && !warn && !stale ? 'green' : '', !crit && !warn ? 'nominal' : ''],
  ];
  $('#annun').innerHTML = tiles.map(([t, c, s]) => `<div class="tile ${c}">${t}${s ? `<small>${esc(s)}</small>` : ''}</div>`).join('');
  $('#sweep').textContent = f ? HB.fmtAgo(f.generatedAt) : 'no feed';
  const all = Object.values(d.kuma.byName); const up = all.filter(m => m.status === 'up').length;
  $('#mon').textContent = all.length ? `${up}/${all.length} up` : '—';
  $('#mon').style.color = up === all.length ? 'var(--green)' : 'var(--amber)';
}

// ---------- scope
let blips = [];
function renderScope(d) {
  const cv = $('#scope'); const ctx = cv.getContext('2d'); const W = cv.width, H = cv.height; const cx = W / 2, cy = H / 2, R = W / 2 - 6;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1a14'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#1f3a2c'; ctx.lineWidth = 1;
  const rings = RING_ORDER.length;
  for (let i = 1; i <= rings; i++) { ctx.beginPath(); ctx.arc(cx, cy, R * i / rings, 0, Math.PI * 2); ctx.stroke(); }
  const svc = HB.services.filter(s => s.status !== 'retired' && (s.url || s.kind === 'game-mc' || s.kind === 'game-udp') && s.link !== false);
  const hosts = SECTORS.map(x => x[0]);
  const hostOf = s => (SECTORS.find(x => x[1].includes(s.host)) || SECTORS[4])[0];
  const sector = Math.PI * 2 / hosts.length;
  // sector lines + labels
  ctx.font = '11px "B612 Mono", monospace'; ctx.fillStyle = '#6a8c78'; ctx.textAlign = 'center';
  hosts.forEach((h, i) => {
    const a = -Math.PI / 2 + sector * i;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
    const am = a + sector / 2; ctx.fillText(h.toUpperCase(), cx + Math.cos(am) * (R - 22), cy + Math.sin(am) * (R - 22) + 4);
  });
  // ring labels
  ctx.textAlign = 'left'; ctx.fillStyle = '#48664f';
  RING_ORDER.forEach((f, i) => ctx.fillText(f, cx + 4, cy - R * (i + 1) / rings + 10));
  // blips
  blips = [];
  hosts.forEach((h, hi) => {
    const list = svc.filter(s => hostOf(s) === h).sort((a, b) => RING_ORDER.indexOf(a.fn) - RING_ORDER.indexOf(b.fn));
    list.forEach((s, si) => {
      const fi = Math.max(0, RING_ORDER.indexOf(s.fn));
      const same = list.filter(x => x.fn === s.fn); const k = same.indexOf(s);
      const rr = R * (fi + .5) / rings + (same.length > 1 ? ((k % 3) - 1) * (R / rings) * .3 : 0);
      const a = -Math.PI / 2 + sector * hi + sector * ((si + 1) / (list.length + 1));
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      const st = HB.serviceStatus(s); const col = COL[st] || COL.none;
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, st === 'down' ? 5 : 4, 0, Math.PI * 2); ctx.fill();
      if (st === 'down') { ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.stroke(); }
      blips.push({ x, y, s, st });
    });
  });
  ctx.strokeStyle = '#2e5a40'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
}
(function scopeEvents() {
  const cv = $('#scope'), tip = $('#tip');
  const hit = e => { const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height; return blips.find(b => Math.hypot(b.x - x, b.y - y) < 9); };
  cv.addEventListener('mousemove', e => { const b = hit(e); if (b) { tip.style.display = 'block'; const r = cv.getBoundingClientRect(); tip.style.left = (e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top - 8) + 'px'; tip.textContent = `${b.s.label} · ${b.st}${b.s.port ? ' · :' + b.s.port : ''}`; cv.style.cursor = b.s.url ? 'pointer' : 'default'; } else { tip.style.display = 'none'; cv.style.cursor = 'default'; } });
  cv.addEventListener('mouseleave', () => tip.style.display = 'none');
  cv.addEventListener('click', e => { const b = hit(e); if (b?.s.url) window.open(b.s.url, '_blank'); });
})();

// ---------- flight plan + checklist
function renderPlan(d) {
  const games = d.mc.slice().sort((a, b) => b.players - a.players || a.label.localeCompare(b.label));
  const others = HB.services.filter(s => s.kind === 'game-udp' && !s.name.startsWith('bedrock'));
  let html = `<div class="grp">GAME SERVERS · ${games.filter(g => g.online).length}/${games.length} up · ${games.reduce((a, g) => a + g.players, 0)} players</div><ul class="list">`;
  html += games.map(g => `<li><span class="led ${g.online ? 'up' : 'down'}"></span><span>${esc(g.label)} <span class="sub">:${g.port}</span></span><span class="r"><b>${g.online ? g.players + '/' + g.max : 'OFFLINE'}</b> ${esc(g.version || '')}</span></li>`).join('');
  html += others.map(s => { const h = HB.host(s.host); const c = h?.docker?.containers?.find(c => c.name === s.name); const st = s.status !== 'live' ? s.status : (c ? (c.state === 'running' ? (c.health === 'unhealthy' ? 'pending' : 'up') : 'down') : 'none'); return `<li><span class="led ${st}"></span><span>${esc(s.label)} <span class="sub">udp ${s.port}</span></span><span class="r"><b>${esc(c?.status || s.status)}</b></span></li>`; }).join('');
  html += `</ul><div class="grp">PLEX · ${d.plex ? d.plex.streams + ' streaming' : 'no data'}</div><ul class="list">`;
  html += d.plex?.sessions?.length ? d.plex.sessions.map(s => `<li><span class="led up"></span><span>${esc(s.user)} · ${esc(s.title)}</span><span class="r">${esc(s.state)}</span></li>`).join('') : `<li><span class="led paused"></span><span class="sub">nobody watching</span><span></span></li>`;
  html += '</ul>';
  $('#plan').innerHTML = html;

  let cl = '';
  for (const fn of FN_ORDER) {
    const items = HB.services.filter(s => s.fn === fn && s.url && s.link !== false && s.status !== 'retired');
    if (!items.length) continue;
    cl += `<div class="grp">${fn.toUpperCase()}</div><ul class="list">` + items.map(s => { const st = HB.serviceStatus(s); return `<li><span class="led ${st}"></span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a><span class="r">${esc(s.host)}</span></li>`; }).join('') + '</ul>';
  }
  const paused = HB.services.filter(s => s.status !== 'live');
  cl += `<div class="grp">PAUSED · RETIRED</div><ul class="list">` + paused.map(s => `<li><span class="led paused"></span><span>${esc(s.label)}</span><span class="r">${s.status}</span></li>`).join('') + '</ul>';
  $('#checklist').innerHTML = cl;
}

async function refresh() {
  try {
    const d = await HB.load();
    renderAnnun(d); renderEngines(d); renderScope(d); renderPlan(d);
  } catch (e) {
    $('#annun').innerHTML = `<div class="tile red">DATA LINK LOST<small>${esc(e.message)}</small></div>`;
  }
}
refresh(); setInterval(refresh, 60000);
</script>
</body>
</html>
