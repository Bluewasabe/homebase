# Static, read-only JSON feed. healthwatch (BlueRig) scp's state/latest.json
# into /opt/homebase/feed on hub after every sweep; dashboards read it here.
services:
  feed:
    image: nginx:alpine
    container_name: feed
    restart: unless-stopped
    ports:
      - "3009:80"
    volumes:
      - /opt/homebase/feed:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/latest.json"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
